<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskBoard / Copilot SDLC</title>
<link rel="stylesheet" href="/styles.css">
<main>
  <header><p>GITHUB COPILOT OFFICE HOUR / LOCAL DEMO</p><h1>Team tasks</h1></header>
  <section class="toolbar" aria-label="Task controls">
    <strong id="count" role="status">Loading tasks...</strong>
  </section>
  <p id="error" role="alert" hidden></p>
  <ul id="tasks" aria-label="Tasks"></ul>
  <footer>Browser -> Node.js API -> task data | Synthetic data only</footer>
</main>
<script src="/app.js" type="module"></script>
</html>
